<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f4c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Medicare Cost Calculator</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --card2:#eef3f1; --text:#17211f; --muted:#5b6b67; --line:#dde5e1;
  --teal:#0f4c4a; --teal2:#14706b; --accent:#c17a1a; --accent-bg:#fdf3e0; --total-bg:#0f4c4a; --total-text:#fff;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1514; --card:#18201e; --card2:#1f2a27; --text:#eef3f1; --muted:#a7b8b3; --line:#2a3632; --teal:#7fd1c8; --teal2:#7fd1c8; --accent:#e8b25a; --accent-bg:#2b2416; --total-bg:#14706b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;line-height:1.2;margin:4px 0 6px;letter-spacing:-.02em}
.lede{color:var(--muted);font-size:15px;margin:0 0 18px}
.langbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px}
.langbar label{font-size:13px;color:var(--muted);font-weight:600}
.langbar select{width:auto;min-height:40px;padding:6px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal2);margin:0 0 10px;font-weight:700}
.assump{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.assump li{display:flex;gap:8px;align-items:flex-start}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal2);margin-top:8px;flex-shrink:0}
label.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
fieldset{border:0;margin:16px 0 0;padding:0}
legend{font-size:14px;font-weight:600;margin-bottom:8px;padding:0}
.options{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;min-height:52px}
.opt:has(input:checked){border-color:var(--teal2);background:var(--card2);outline:2px solid color-mix(in srgb, var(--teal2) 35%, transparent)}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:#14706b;flex-shrink:0}
.opt b{display:block;font-size:14px;overflow-wrap:anywhere}
.opt>span{flex:1;min-width:0}
.opt span span{font-size:13px;color:var(--muted)}
.totalbox{background:var(--total-bg);color:var(--total-text);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.totalbox .tlabel{font-size:13px;opacity:.85}
.total-flex{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;font-weight:600;opacity:.85}
.year{font-size:15px;text-align:right}
.year b{font-size:20px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18);margin-top:14px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{background:var(--accent-bg);border-radius:12px;padding:12px;font-size:13.5px;margin-top:12px}
.note:empty{display:none}
.muted{color:var(--muted);font-size:13px}
.ref{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ref div{background:var(--card2);border-radius:12px;padding:12px}
.ref b{display:block;font-size:18px}
.ref span{font-size:12.5px;color:var(--muted)}
.def{font-size:14px;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:6px}
.rule-group{margin-top:16px}
.rule-group:first-of-type{margin-top:8px}
.rule-group h3{font-size:15px;margin:0 0 4px;color:var(--text)}
.rule-group .gintro{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.rule-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rule-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.rule-item .st{flex-shrink:0;font-weight:700;font-size:12px;background:var(--teal);color:#fff;border-radius:8px;padding:3px 8px;margin-top:1px;min-width:38px;text-align:center}
@media (prefers-color-scheme: dark){ .rule-item .st{background:var(--teal2);color:#0e1514} }
.rule-item .tx{min-width:0}
.rule-item .tx b{display:block;font-size:13.5px}
.rule-item .tx span{color:var(--muted)}
.warn{background:var(--accent-bg);border-radius:12px;padding:12px;font-size:13.5px;margin-top:10px}
.gnote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.secdisc{font-size:12.5px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px}
footer{font-size:12.5px;color:var(--muted);line-height:1.7}
footer a{color:var(--teal2);word-break:break-all}
footer ul{padding-left:18px;margin:6px 0}
button,select{min-height:44px}
.langbar select{min-height:40px}
</style>
</head>
<body>
<main class="wrap">
  <div class="langbar">
    <label for="langSel" id="langLbl">语言 / Language</label>
    <select id="langSel" aria-label="Language / 语言">
      <option value="zh" selected>中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>

  <section class="card">
    <h2 id="assumpH"></h2>
    <ul class="assump">
      <li><span class="dot"></span><span id="a1"></span></li>
      <li><span class="dot"></span><span id="a2"></span></li>
      <li><span class="dot"></span><span id="a3"></span></li>
    </ul>
  </section>

  <section class="card">
    <label class="lbl" for="stateSel" id="stateLbl"></label>
    <select id="stateSel"></select>

    <fieldset>
      <legend id="comboLegend"></legend>
      <div class="options" id="comboBox">
        <label class="opt"><input type="radio" name="combo" value="full" checked><span><b id="cFullT"></b><span id="cFullS"></span></span></label>
        <label class="opt"><input type="radio" name="combo" value="origD"><span><b id="cOrigDT"></b><span id="cOrigDS"></span></span></label>
        <label class="opt"><input type="radio" name="combo" value="ma"><span><b id="cMaT"></b><span id="cMaS"></span></span></label>
        <label class="opt"><input type="radio" name="combo" value="orig"><span><b id="cOrigT"></b><span id="cOrigS"></span></span></label>
      </div>
    </fieldset>
  </section>

  <section class="totalbox" aria-live="polite">
    <div class="tlabel" id="totalLabel"></div>
    <div class="total-flex">
      <div class="big"><span id="totalMo">$0</span> <small id="perMo"></small></div>
      <div class="year"><span id="perYrLbl"></span><br><b id="totalYr">$0</b></div>
    </div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </section>

  <section class="card">
    <h2 id="breakH"></h2>
    <table>
      <thead><tr><th id="colItem"></th><th class="amt" id="colMo"></th><th class="amt" id="colYr"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="note" id="stateNote"></div>
    <p class="muted" id="excludeNote" style="margin-top:10px"></p>
  </section>

  <section class="card">
    <h2 id="refH"></h2>
    <div class="ref">
      <div><b>$283</b><span id="ref1"></span></div>
      <div><b>$1,736</b><span id="ref2"></span></div>
      <div><b id="ref3b"></b><span id="ref3"></span></div>
      <div><b id="ref4b"></b><span id="ref4"></span></div>
    </div>
    <p class="muted" id="refNote" style="margin:10px 0 0"></p>
  </section>

  <section class="card">
    <h2 id="rulesH"></h2>
    <div class="def" id="rulesDef"></div>
    <div id="rulesBody"></div>
    <p class="secdisc" id="rulesDisc"></p>
  </section>

  <footer>
    <strong style="color:var(--text)" id="srcH"></strong>
    <ul id="srcList"></ul>
    <p id="disclaimer"></p>
    <p id="tip"></p>
  </footer>
</main>

  el("colItem").textContent=t.colItem; el("colMo").textContent=t.colMo; el("colYr").textContent=t.colYr;
  el("refH").textContent=t.refH;
  el("ref1").innerHTML=t.ref1; el("ref2").innerHTML=t.ref2;
  el("ref3b").textContent=t.ref3b; el("ref3").innerHTML=t.ref3;
  el("ref4b").textContent=t.ref4b; el("ref4").innerHTML=t.ref4;
  el("refNote").textContent=t.refNote;
  el("rulesH").textContent=t.rulesH;
  el("rulesDef").innerHTML=t.rulesDef;
  el("rulesDisc").textContent=t.rulesDisc;
  el("srcH").textContent=t.srcH;
  var sl=el("srcList"); sl.innerHTML="";
  SOURCES.forEach(function(src){
    var li=document.createElement("li");
    li.appendChild(document.createTextNode(LANG==="zh" ? src.zh : src.en));
    var a=document.createElement("a"); a.href=src.url; a.target="_blank"; a.rel="noopener"; a.textContent=src.url;
    li.appendChild(a);
    var tail = LANG==="zh" ? src.tailZh : src.tailEn;
    if(tail) li.appendChild(document.createTextNode(tail));
    sl.appendChild(li);
  });
  el("disclaimer").textContent=t.disclaimer;
  el("tip").textContent=t.tip;
  buildStateOptions();
  renderRules();
  render();
}

sel.addEventListener("change", render);
el("comboBox").addEventListener("change", render);
el("langSel").addEventListener("change", function(){ LANG = this.value; applyLang(); });
sel.value="MA";
applyLang();
</script>
</body>
</html>
